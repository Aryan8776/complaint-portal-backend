<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaint History | CityConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --user-primary: #4b6cb7;
            --user-dark: #2f4a7d;
            --user-gradient: linear-gradient(135deg, #5a7ecf, #2f4a7d);
            --white: #ffffff;
            --off-white: #f8f9fa;
            --bg-gray: #e9ecef;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --border-color: #eee;
            --shadow-card: 0 10px 20px rgba(0,0,0,0.05);
            --radius: 15px;
            --transition: 0.3s ease;
            --status-pending-bg: #fff3cd; --status-pending-text: #856404;
            --status-solved-bg: #d4edda; --status-solved-text: #155724;
            --status-rejected-bg: #f8d7da; --status-rejected-text: #721c24;
        }

        [data-theme="dark"] {
            --bg-gray: #121212;
            --white: #1e1e1e;
            --off-white: #2d2d2d;
            --text-dark: #e0e0e0;
            --text-light: #a0a0a0;
            --border-color: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: font-size 0.3s ease;
        }

        body.size-small { font-size: 13px; }
        body.size-medium { font-size: 16px; }
        body.size-large { font-size: 19px; }

        aside {
            width: 260px;
            background: var(--white);
            height: 100%;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 1000;
            transition: transform 0.4s ease;
        }

        .brand { font-size: 20px; font-weight: 700; color: var(--user-primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-links { list-style: none; }
        .nav-item { padding: 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; color: var(--text-light); font-weight: 500; transition: var(--transition); display: flex; align-items: center; gap: 12px; }
        .nav-item:hover, .nav-item.active { background-color: #eff3ff; color: var(--user-primary); }
        [data-theme="dark"] .nav-item:hover, [data-theme="dark"] .nav-item.active { background-color: rgba(75, 108, 183, 0.2); }

        .user-profile { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .avatar { width: 40px; height: 40px; background: var(--user-gradient); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        main { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h2 { font-weight: 600; color: var(--text-dark); }

        .controls-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--white); padding: 15px 25px; border-radius: var(--radius);
            box-shadow: var(--shadow-card); margin-bottom: 25px;
        }

        .search-container { position: relative; width: 300px; }
        .search-container input { width: 100%; padding: 10px 15px 10px 40px; border: 1px solid var(--border-color); border-radius: 30px; outline: none; background: var(--off-white); color: var(--text-dark); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 14px; }
        
        .filter-chips { display: flex; gap: 10px; flex-wrap: wrap; }
        .chip { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--off-white); color: var(--text-light); transition: var(--transition); border: 1px solid transparent; }
        .chip.active { background: var(--user-primary); color: var(--white); }

        .history-container { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 15px; font-size: 13px; color: var(--text-light); text-transform: uppercase; border-bottom: 2px solid var(--bg-gray); }
        td { padding: 18px 15px; font-size: 14px; border-bottom: 1px solid var(--bg-gray); vertical-align: middle; color: var(--text-dark); }

        .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .status-pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
        .status-resolved, .status-approved { background: var(--status-solved-bg); color: var(--status-solved-text); }
        .status-rejected { background: var(--status-rejected-bg); color: var(--status-rejected-text); }
        
        .btn-view { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--user-primary); font-size: 12px; font-weight: 600; cursor: pointer; }

        .detail-row { display: none; background-color: var(--off-white); }
        .detail-row.visible { display: table-row; }
        .detail-content { padding: 20px; display: flex; gap: 20px; }
        .detail-img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; background: #eee; }
        .detail-info h5 { margin-bottom: 8px; font-size: 15px; color: var(--user-primary); }

        @media (max-width: 768px) {
            aside { position: fixed; left: 0; transform: translateX(-100%); }
            aside.open { transform: translateX(0); }
            main { padding: 15px; }
            .controls-bar { flex-direction: column; align-items: stretch; gap: 15px; }
            .search-container { width: 100%; }
            .mobile-top-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
            .menu-btn { background: var(--white); border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 20px; display: block; color: var(--text-dark); }
            .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; }
            .overlay.active { display: block; }
            .detail-content { flex-direction: column; }
            .detail-img { width: 100%; height: 200px; }
        }
    </style>
</head>
<body class="size-medium">

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside id="sidebar">
        <div class="brand">
            <span>🏛️ CityConnect</span>
        </div>
        <ul class="nav-links">
            <li class="nav-item translatable" onclick="window.location.href='User.html'">New Complaint</li>
            <li class="nav-item active translatable">My History</li>
            <li class="nav-item translatable" onclick="window.location.href='UserSettings.html'">Settings</li>
        </ul>

        <div class="user-profile">
            <div class="avatar">U</div>
            <div class="user-info">
                <div id="userNameDisplay" style="font-size: 14px; font-weight: 600;">Citizen</div>
                <div class="translatable" style="font-size: 12px; color: var(--text-light);">Active User</div>
            </div>
        </div>
    </aside>

    <main>
        <div class="mobile-top-bar">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <h2 class="translatable" style="margin: 0;">My History</h2>
        </div>

        <h2 class="translatable" id="desktop-title" style="margin-bottom: 20px;">My Complaint History</h2>

        <div class="controls-bar">
            <div class="filter-chips">
                <div class="chip active translatable" data-filter="all">All Cases</div>
                <div class="chip translatable" data-filter="pending">Pending</div>
                <div class="chip translatable" data-filter="resolved">Resolved</div>
                <div class="chip translatable" data-filter="rejected">Rejected</div>
            </div>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="translatable-placeholder" placeholder="Search ID or Dept...">
            </div>
        </div>

        <div class="history-container">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th class="translatable">Case ID</th>
                        <th class="translatable">Dept</th>
                        <th class="translatable">Date</th>
                        <th class="translatable">Status</th>
                        <th class="translatable">Location</th>
                        <th class="translatable" style="text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="text-align:center; padding:30px;">Loading your complaints...</td></tr>
                </tbody>
            </table>
            
            <div id="noResults" style="display:none; text-align:center; padding: 40px; color: #999;">
                <p class="translatable">No complaints found matching your criteria.</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "https://mycityconnect-dgxu.onrender.com";
        let allComplaints = [];

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        async function fetchHistory() {
            try {
                const res = await fetch(`${API_BASE}/api/complaints`);
                if (!res.ok) throw new Error("Network response was not ok");
                allComplaints = await res.json();
                renderTable(allComplaints);
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="6" style="text-align:center; color: #c0392b; padding:30px;">
                        Error loading data. Please ensure the server is online.
                    </td></tr>`;
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = "";
            
            if(!data || data.length === 0) { 
                document.getElementById('noResults').style.display = 'block'; 
                return; 
            }
            document.getElementById('noResults').style.display = 'none';

            data.forEach(item => {
                const status = item.status ? item.status.toLowerCase() : 'pending';
                const date = item.createdAt ? new Date(item.createdAt).toLocaleDateString() : 'N/A';
                const idShort = item._id ? item._id.slice(-6).toUpperCase() : '---';
                const imgPath = item.image ? `${API_BASE}/uploads/${item.image}` : 'https://via.placeholder.com/150?text=No+Image';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight:600;color:#4b6cb7;">#${idShort}</td>
                    <td class="translatable">${item.department || 'General'}</td>
                    <td>${date}</td>
                    <td><span class="badge status-${status} translatable">${status}</span></td>
                    <td class="translatable">${item.area || 'Unknown'}</td>
                    <td style="text-align:center;"><button class="btn-view translatable" onclick="toggleDetails('${item._id}')">View</button></td>
                `;
                
                const detailRow = document.createElement('tr');
                detailRow.id = `detail-${item._id}`;
                detailRow.className = 'detail-row';
                detailRow.innerHTML = `
                    <td colspan="6">
                        <div class="detail-content">
                            <img src="${imgPath}" class="detail-img" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                            <div class="detail-info">
                                <h5>Full ID: #${item._id}</h5>
                                <p><strong>Description:</strong> ${item.description || 'No description provided.'}</p>
                                <p style="margin-top:10px;"><strong>Status Details:</strong> <span class="translatable">${item.status || 'Pending Review'}</span></p>
                            </div>
                        </div>
                    </td>`;
                
                tableBody.appendChild(row);
                tableBody.appendChild(detailRow);
            });
            
            checkTranslation();
        }

        window.toggleDetails = function(id) {
            const el = document.getElementById(`detail-${id}`);
            const isVisible = el.classList.contains('visible');
            document.querySelectorAll('.detail-row').forEach(row => row.classList.remove('visible'));
            if (!isVisible) el.classList.add('visible');
        }

        // Filters
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                const filter = this.getAttribute('data-filter');
                
                if (filter === 'all') {
                    renderTable(allComplaints);
                } else if (filter === 'resolved') {
                    renderTable(allComplaints.filter(c => c.status === 'resolved' || c.status === 'approved'));
                } else {
                    renderTable(allComplaints.filter(c => c.status === filter));
                }
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allComplaints.filter(c => 
                (c._id && c._id.toLowerCase().includes(term)) || 
                (c.department && c.department.toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        // Theme & Language
        function applySettings() {
            const theme = localStorage.getItem('theme') || 'light';
            const size = localStorage.getItem('textSize') || 'medium';
            document.documentElement.setAttribute('data-theme', theme);
            document.body.className = `size-${size}`;
        }

        async function checkTranslation() {
            const lang = localStorage.getItem('lang') || 'en';
            if (lang !== 'en') {
                const elements = document.querySelectorAll(".translatable");
                for (const el of elements) {
                    const text = el.innerText;
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`;
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        el.innerText = data[0][0][0];
                    } catch (err) {}
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            applySettings();
            fetchHistory();
        });
    </script>
</body>
</html>
