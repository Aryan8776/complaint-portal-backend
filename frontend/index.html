<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal Access</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
       
        :root {
          
            --user-primary: #4b6cb7;
            --user-gradient: linear-gradient(135deg, #5a7ecf, #2f4a7d);
            
            --admin-primary: #2c3e50;
            --admin-gradient: linear-gradient(135deg, #34495e, #2c3e50);

            --white: #ffffff;
            --off-white: #f8f9fa;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --overlay-text: rgba(255, 255, 255, 0.95); 
            
            --shadow-light: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.08);
            --transition-speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9ecef;
            background: radial-gradient(circle at top left, #dfe6e9, #b2bec3);
            position: relative;
        }

        /* --- LANGUAGE SWITCHER STYLES --- */
        .lang-switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .lang-select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .lang-select:hover {
            background: var(--white);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            width: 900px;
            max-width: 100%;
            height: 600px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-light);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FORM CONTAINERS --- */
        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all var(--transition-speed) ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            width: 50%;
        }

        .user-container {
            left: 0;
            z-index: 2;
        }

        .admin-container {
            left: 0;
            opacity: 0;
            z-index: 1;
        }

        /* --- TYPOGRAPHY & INPUTS --- */
        form {
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            text-align: center;
        }

        form h1 {
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }

        input {
            background-color: var(--off-white);
            border: 2px solid transparent;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
            color: var(--text-dark);
        }

        input:focus {
            background-color: var(--white);
            border-color: #dcdde1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .user-container input:focus { border-bottom: 2px solid var(--user-primary); }
        .admin-container input:focus { border-bottom: 2px solid var(--admin-primary); }

        /* Hidden field animation for Sign Up */
        #nameInputContainer {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin 0.4s ease;
        }
        
        #nameInputContainer.visible {
            max-height: 70px;
            opacity: 1;
            margin-bottom: 0px;
        }

        /* --- BUTTONS --- */
        button {
            border-radius: 50px;
            border: none;
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            padding: 15px 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 25px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .btn-user { background: var(--user-gradient); }
        .btn-admin { background: var(--admin-gradient); }

        /* Toggle Link Styles */
        .toggle-link {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-light);
        }

        .toggle-link a {
            color: var(--user-primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px dashed transparent;
            transition: border-bottom 0.3s ease;
        }

        .toggle-link a:hover {
            border-bottom: 1px dashed var(--user-primary);
        }

        /* --- OVERLAY --- */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform var(--transition-speed) ease-in-out;
            z-index: 100;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .overlay {
            background: var(--user-gradient);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: var(--overlay-text);
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform var(--transition-speed) ease-in-out;
        }

        .container.right-panel-active .overlay {
            background: var(--admin-gradient);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform var(--transition-speed) ease-in-out;
        }

        /* Overlay Typography */
        .overlay-panel h1 {
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--white);
        }

        .overlay-panel p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 30px;
            color: var(--overlay-text);
        }

        .overlay-left { transform: translateX(-20%); }
        .overlay-right { right: 0; transform: translateX(0); }

        .ghost {
            background: transparent;
            border: 2px solid var(--white);
            margin-top: 0;
            box-shadow: none;
            font-weight: 700;
            padding: 12px 40px;
        }
        
        .ghost:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* --- ANIMATION STATES --- */
        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .container.right-panel-active .overlay { transform: translateX(50%); }
        .container.right-panel-active .user-container { transform: translateX(100%); opacity: 0; }
        .container.right-panel-active .admin-container { transform: translateX(100%); opacity: 1; z-index: 5; }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

    </style>
</head>

<body>

<div class="lang-switch-container">
<select id="languageSelect" class="lang-select">
<option value="en">English</option>
<option value="hi">हिंदी</option>
<option value="mr">मराठी</option>
</select>
</div>

<div class="container" id="container">

<!-- USER -->
<div class="form-container user-container">
<form id="userForm">

<h1 id="txt-user-welcome">Welcome Back</h1>
<p class="subtitle" id="txt-user-sub">Please enter your details to sign in.</p>

<div id="nameInputContainer">
<div class="input-group">
<input type="text" id="ph-fullname" placeholder="Full Name">
</div>
</div>

<div class="input-group">
<input type="email" id="ph-email" placeholder="Email Address">
</div>

<div class="input-group">
<input type="password" id="ph-pass" placeholder="Password">
</div>

<button class="btn-user" id="userFormBtn">Sign In</button>

<p class="toggle-link">
<span id="toggleText">New here?</span>
<a id="toggleUserMode">Create an Account</a>
</p>

</form>
</div>

<!-- ADMIN -->
<div class="form-container admin-container">
<form id="adminForm">

<h1 id="txt-admin-title">Admin Portal</h1>
<p class="subtitle" id="txt-admin-sub">Secure access for authorized personnel only.</p>

<div class="input-group">
<input type="text" id="ph-admin-id" placeholder="Admin ID">
</div>

<div class="input-group">
<input type="password" id="ph-admin-pass" placeholder="Secure Password">
</div>

<button class="btn-admin" id="btn-admin-access">Access Dashboard</button>

</form>
</div>

<!-- OVERLAY -->
<div class="overlay-container">
<div class="overlay">

<div class="overlay-panel overlay-left">
<h1 id="txt-overlay-user-title">User Access</h1>
<p id="txt-overlay-user-desc">Return to the standard user login page.</p>
<button class="ghost" id="signIn">Go to User Login</button>
</div>

<div class="overlay-panel overlay-right">
<h1 id="txt-overlay-admin-title">Admin Access</h1>
<p id="txt-overlay-admin-desc">Restricted area.</p>
<button class="ghost" id="signUp">Go to Admin Portal</button>
</div>

</div>
</div>

</div>

<script>



const signUpButton = document.getElementById("signUp");
const signInButton = document.getElementById("signIn");
const container = document.getElementById("container");

signUpButton.onclick = () =>
  container.classList.add("right-panel-active");

signInButton.onclick = () =>
  container.classList.remove("right-panel-active");



const toggleUserMode = document.getElementById("toggleUserMode");
const toggleText = document.getElementById("toggleText");
const nameInputContainer =
  document.getElementById("nameInputContainer");

const userFormTitle =
  document.getElementById("txt-user-welcome");

const userFormBtn =
  document.getElementById("userFormBtn");

let isSignupMode = false;

function updateFormModeUI() {
  const lang =
    document.getElementById("languageSelect").value;

  const t = translations[lang];

  if (isSignupMode) {
    nameInputContainer.classList.add("visible");
    userFormTitle.textContent = t.createAccount;
    userFormBtn.textContent = t.btnSignUp;
    toggleText.textContent = t.alreadyAccount;
    toggleUserMode.textContent = t.signInLink;
  } else {
    nameInputContainer.classList.remove("visible");
    userFormTitle.textContent = t.userWelcome;
    userFormBtn.textContent = t.btnSignIn;
    toggleText.textContent = t.newHere;
    toggleUserMode.textContent = t.createAccountLink;
  }
}

toggleUserMode.addEventListener("click", e => {
  e.preventDefault();
  isSignupMode = !isSignupMode;
  updateFormModeUI();
});



document
  .getElementById("userForm")
  .addEventListener("submit", async e => {
    e.preventDefault();

    const name =
      document.getElementById("ph-fullname").value;

    const email =
      document.getElementById("ph-email").value;

    const password =
      document.getElementById("ph-pass").value;

    const url = isSignupMode
      ? "hhttps://mycityconnect-dgxu.onrender.com/api/auth/register"
      : "hhttps://mycityconnect-dgxu.onrender.com/api/auth/login";

    const body = isSignupMode
      ? { name, email, password }
      : { email, password };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (data.token) {
      localStorage.setItem("token", data.token);
      window.location.href = "User.html";
    } else {
      alert(data.msg || "Login failed");
    }
  });



document
  .getElementById("adminForm")
  .addEventListener("submit", async e => {
    e.preventDefault();

    const adminId =
      document.getElementById("ph-admin-id").value;

    const password =
      document.getElementById("ph-admin-pass").value;

    const res = await fetch(
      "hhttps://mycityconnect-dgxu.onrender.com/api/auth/admin-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ adminId, password })
      }
    );

    const data = await res.json();

    if (data.token) {
      localStorage.setItem("adminToken", data.token);
      window.location.href = "Admin.html";
    } else {
      alert(data.msg || "Unauthorized");
    }
  });



const translations = {
  en: {
    userWelcome: "Welcome Back",
    userSub: "Please enter your details to sign in.",
    createAccount: "Create Account",
    phName: "Full Name",
    phEmail: "Email Address",
    phPass: "Password",
    btnSignIn: "Sign In",
    btnSignUp: "Sign Up",
    newHere: "New here?",
    alreadyAccount: "Already have an account?",
    createAccountLink: "Create an Account",
    signInLink: "Sign In",
    adminTitle: "Admin Portal",
    adminSub:
      "Secure access for authorized personnel only.",
    phAdminId: "Admin ID",
    phAdminPass: "Secure Password",
    btnAccess: "Access Dashboard",
    overlayUserTitle: "User Access",
    overlayUserDesc:
      "Return to the standard user login page.",
    btnGoUser: "Go to User Login",
    overlayAdminTitle: "Admin Access",
    overlayAdminDesc:
      "Restricted area. Please switch only if authorized.",
    btnGoAdmin: "Go to Admin Portal"
     },
         hi: {
          userWelcome: "स्वागत है",
          userSub: "कृपया साइन इन करने के लिए अपना विवरण दर्ज करें।",
                  createAccount: "खाता बनाएं",
                  phName: "पूरा नाम",
                  phEmail: "ईमेल पता",
                  phPass: "पासवर्ड",
                  btnSignIn: "साइन इन करें",
                  btnSignUp: "साइन अप करें",
                  newHere: "यहाँ नए हैं?",
                  alreadyAccount: "क्या पहले से खाता है?",
                  createAccountLink: "खाता बनाएं",
                  signInLink: "साइन इन करें",
                  adminTitle: "एडमिन पोर्टल",
                  adminSub: "केवल अधिकृत कर्मियों के लिए सुरक्षित पहुंच।",
                  phAdminId: "एडमिन आईडी",
                  phAdminPass: "सुरक्षित पासवर्ड",
                  btnAccess: "डैशबोर्ड एक्सेस करें",
                  overlayUserTitle: "उपयोगकर्ता एक्सेस",
                  overlayUserDesc: "मानक उपयोगकर्ता लॉगिन पृष्ठ पर लौटें।",
                  btnGoUser: "लॉगिन पर जाएं",
                  overlayAdminTitle: "एडमिन एक्सेस",
                  overlayAdminDesc: "प्रतिबंधित क्षेत्र। केवल अधिकृत होने पर स्विच करें।",
                  btnGoAdmin: "एडमिन पोर्टल पर जाएं"
              },
              mr: {
                  userWelcome: "स्वागत आहे",
                  userSub: "कृपया साइन इन करण्यासाठी आपले तपशील प्रविष्ट करा.",
                  createAccount: "नवीन खाते तयार करा",
                  phName: "पूर्ण नाव",
                  phEmail: "ईमेल पत्ता",
                  phPass: "पासवर्ड",
                  btnSignIn: "साइन इन करा",
                  btnSignUp: "साइन अप करा",
                  newHere: "येथे नवीन आहात?",
                  alreadyAccount: "आधीच खाते आहे का?",
                  createAccountLink: "खाते तयार करा",
                  signInLink: "साइन इन करा",
                  adminTitle: "अडमिन पोर्टल",
                  adminSub: "केवळ अधिकृत कर्मचाऱ्यांसाठी सुरक्षित प्रवेश.",
                  phAdminId: "अडमिन आयडी",
                  phAdminPass: "सुरक्षित पासवर्ड",
                  btnAccess: "डॅशबोर्डमध्ये प्रवेश करा",
                  overlayUserTitle: "वापरकर्ता प्रवेश",
                  overlayUserDesc: "वापरकर्ता लॉगिन पृष्ठावर परत जा.",
                  btnGoUser: "वापरकर्ता लॉगिन",
                  overlayAdminTitle: "अडमिन प्रवेश",
                  overlayAdminDesc: "प्रतिबंधित क्षेत्र. केवळ अधिकृत असल्यास स्विच करा.",
                  btnGoAdmin: "अडमिन पोर्टलवर जा"
}
};
</script>

</body>
</html>
