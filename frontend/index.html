<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --user-primary: #4b6cb7;
            --user-gradient: linear-gradient(135deg, #5a7ecf, #2f4a7d);
            --admin-primary: #2c3e50;
            --admin-gradient: linear-gradient(135deg, #34495e, #2c3e50);
            --white: #ffffff;
            --off-white: #f8f9fa;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --overlay-text: rgba(255, 255, 255, 0.95); 
            --shadow-light: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.08);
            --transition-speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #dfe6e9, #b2bec3);
            overflow: hidden;
        }

        /* --- LANGUAGE SWITCHER --- */
        .lang-switch-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .lang-select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            width: 900px;
            max-width: 95%;
            height: 600px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-light);
            overflow: hidden;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all var(--transition-speed) ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            width: 50%;
        }

        .user-container { left: 0; z-index: 2; }
        .admin-container { left: 0; opacity: 0; z-index: 1; }

        .container.right-panel-active .user-container { transform: translateX(100%); opacity: 0; }
        .container.right-panel-active .admin-container { transform: translateX(100%); opacity: 1; z-index: 5; }

        form { width: 100%; text-align: center; }
        form h1 { font-weight: 700; margin-bottom: 10px; color: var(--text-dark); }
        .subtitle { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }

        .input-group { width: 100%; margin: 8px 0; }
        input {
            background-color: var(--off-white);
            border: 2px solid transparent;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-bottom: 2px solid var(--user-primary); }

        #nameInputContainer {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s ease;
        }
        #nameInputContainer.visible { max-height: 60px; opacity: 1; margin-bottom: 5px; }

        button {
            border-radius: 50px;
            border: none;
            color: var(--white);
            font-size: 12px;
            font-weight: 600;
            padding: 12px 40px;
            text-transform: uppercase;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.1s ease;
        }
        button:active { transform: scale(0.95); }

        .btn-user { background: var(--user-gradient); }
        .btn-admin { background: var(--admin-gradient); }
        .toggle-link { margin-top: 15px; font-size: 12px; color: var(--text-light); }
        .toggle-link a { color: var(--user-primary); font-weight: 600; text-decoration: none; cursor: pointer; }

        /* --- OVERLAY --- */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform var(--transition-speed) ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: var(--user-gradient);
            color: var(--white);
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform var(--transition-speed) ease-in-out;
        }
        .container.right-panel-active .overlay { transform: translateX(50%); background: var(--admin-gradient); }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 30px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transition: transform var(--transition-speed) ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        .ghost { background: transparent; border: 2px solid var(--white); padding: 10px 30px; }

        @media (max-width: 600px) {
            .container { height: 550px; }
            .form-container { padding: 0 20px; }
            .overlay-panel h1 { font-size: 18px; }
            .overlay-panel p { font-size: 12px; }
            .ghost { padding: 8px 20px; font-size: 11px; }
            form h1 { font-size: 20px; }
        }
    </style>
</head>

<body>

<div class="lang-switch-container">
    <select id="languageSelect" class="lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="mr">मराठी</option>
    </select>
</div>

<div class="container" id="container">
    <div class="form-container user-container">
        <form id="userForm">
            <h1 id="txt-user-welcome">Welcome Back</h1>
            <p class="subtitle" id="txt-user-sub">Sign in to your account.</p>
            
            <div id="nameInputContainer">
                <div class="input-group">
                    <input type="text" id="ph-fullname" placeholder="Full Name">
                </div>
            </div>

            <div class="input-group">
                <input type="email" id="ph-email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="ph-pass" placeholder="Password" required>
            </div>
            
            <button type="submit" class="btn-user" id="userFormBtn">Sign In</button>
            
            <p class="toggle-link">
                <span id="toggleText">New here?</span> 
                <a id="toggleUserMode">Create Account</a>
            </p>
        </form>
    </div>

    <div class="form-container admin-container">
        <form id="adminForm">
            <h1 id="txt-admin-title">Admin Portal</h1>
            <p class="subtitle" id="txt-admin-sub">Restricted access.</p>
            <div class="input-group">
                <input type="text" id="ph-admin-id" placeholder="Admin ID" required>
            </div>
            <div class="input-group">
                <input type="password" id="ph-admin-pass" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-admin" id="btn-admin-access">Login</button>
        </form>
    </div>

    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1 id="txt-overlay-user-title">User?</h1>
                <p id="txt-overlay-user-desc">Standard Login</p>
                <button class="ghost" id="signIn">Switch</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1 id="txt-overlay-admin-title">Admin?</h1>
                <p id="txt-overlay-admin-desc">Dashboard Access</p>
                <button class="ghost" id="signUp">Switch</button>
            </div>
        </div>
    </div>
</div>

<script>
    const translations = {
        en: { userWelcome: "Welcome Back", createAccount: "Create Account", btnSignIn: "Sign In", btnSignUp: "Sign Up", newHere: "New here?", alreadyAccount: "Already a member?", createAccountLink: "Create Account", signInLink: "Sign In" },
        hi: { userWelcome: "नमस्ते", createAccount: "खाता बनाएँ", btnSignIn: "साइन इन", btnSignUp: "साइन अप", newHere: "नए हैं?", alreadyAccount: "सदस्य हैं?", createAccountLink: "खाता बनाएँ", signInLink: "साइन इन" },
        mr: { userWelcome: "स्वागत आहे", createAccount: "खाते तयार करा", btnSignIn: "साइन इन", btnSignUp: "साइन अप", newHere: "नवीन आहात?", alreadyAccount: "सदस्य आहात?", createAccountLink: "खाते तयार करा", signInLink: "साइन इन" }
    };

    const container = document.getElementById("container");
    const signUpButton = document.getElementById("signUp");
    const signInButton = document.getElementById("signIn");

    // Toggle Admin/User Panels
    signUpButton.onclick = () => container.classList.add("right-panel-active");
    signInButton.onclick = () => container.classList.remove("right-panel-active");

    let isSignupMode = false;
    const toggleUserMode = document.getElementById("toggleUserMode");
    
    function updateFormModeUI() {
        const lang = document.getElementById("languageSelect").value;
        const t = translations[lang] || translations.en;
        const nameInput = document.getElementById("nameInputContainer");
        
        if (isSignupMode) {
            nameInput.classList.add("visible");
            document.getElementById("txt-user-welcome").textContent = t.createAccount;
            document.getElementById("userFormBtn").textContent = t.btnSignUp;
            document.getElementById("toggleText").textContent = t.alreadyAccount;
            toggleUserMode.textContent = t.signInLink;
        } else {
            nameInput.classList.remove("visible");
            document.getElementById("txt-user-welcome").textContent = t.userWelcome;
            document.getElementById("userFormBtn").textContent = t.btnSignIn;
            document.getElementById("toggleText").textContent = t.newHere;
            toggleUserMode.textContent = t.createAccountLink;
        }
    }

    toggleUserMode.onclick = (e) => { 
        e.preventDefault(); 
        isSignupMode = !isSignupMode; 
        updateFormModeUI(); 
    };

    // --- USER LOGIN / REGISTER LOGIC ---
    document.getElementById("userForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const name = document.getElementById("ph-fullname").value;
        const email = document.getElementById("ph-email").value;
        const password = document.getElementById("ph-pass").value;

        const url = isSignupMode 
            ? "https://mycityconnect-dgxu.onrender.com/api/auth/register" 
            : "https://mycityconnect-dgxu.onrender.com/api/auth/login";

        const body = isSignupMode ? { name, email, password } : { email, password };

        try {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (data.token) {
                localStorage.setItem("token", data.token);
                window.location.href = "User.html";
            } else {
                alert(data.msg || "Operation failed. Please check your credentials.");
            }
        } catch (err) {
            console.error(err);
            alert("Error connecting to server.");
        }
    });

    // --- ADMIN LOGIN LOGIC ---
    document.getElementById("adminForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const adminId = document.getElementById("ph-admin-id").value;
        const password = document.getElementById("ph-admin-pass").value;

        try {
            const res = await fetch("https://mycityconnect-dgxu.onrender.com/api/auth/admin-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ adminId, password })
            });

            const data = await res.json();

            if (data.token) {
                localStorage.setItem("adminToken", data.token);
                window.location.href = "Admin.html";
            } else {
                alert(data.message || data.msg || "Unauthorized Access");
            }
        } catch (err) {
            alert("Error connecting to server.");
        }
    });

    // --- TRANSLATION API ---
    async function translatePage(lang) {
        const tIds = ["txt-user-sub", "txt-admin-title", "txt-admin-sub", "txt-overlay-user-title", "txt-overlay-user-desc", "txt-overlay-admin-title", "txt-overlay-admin-desc"];
        for (let id of tIds) {
            const el = document.getElementById(id);
            if(el) {
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${lang}&dt=t&q=${encodeURIComponent(el.innerText)}`);
                    const data = await res.json();
                    el.innerText = data[0][0][0];
                } catch(e) { console.error("Translation error", e); }
            }
        }
        updateFormModeUI();
    }

    document.getElementById("languageSelect").onchange = (e) => translatePage(e.target.value);
</script>
</body>
</html>
